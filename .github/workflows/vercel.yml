name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  preview:
    name: Preview deployment
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx --yes vercel@59.23.0 pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
      - run: npx --yes vercel@59.23.0 build --token="${{ secrets.VERCEL_TOKEN }}"
      - run: npx --yes vercel@59.23.0 deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}"

  production:
    name: Production deployment
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx --yes vercel@59.23.0 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - run: npx --yes vercel@59.23.0 build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - run: npx --yes vercel@59.23.0 deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
